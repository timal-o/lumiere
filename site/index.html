<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumière — logiciel gratuit pour graveur laser</title>
  <meta name="description" content="Lumière : logiciel gratuit et libre pour graveurs et découpeuses laser (diode et CO₂). Dessinez, cadrez, gravez. Windows, Mac et Linux.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lumière — logiciel gratuit pour graveur laser">
  <meta property="og:description" content="Dessinez, cadrez, gravez. Gratuit, libre, en français. Windows, Mac et Linux.">
  <meta property="og:image" content="https://timal-o.github.io/lumiere/assets/og.png">
  <meta property="og:url" content="https://timal-o.github.io/lumiere/">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef0f3; --text: #16181d; --muted: #5b6370; --border: #dde1e7;
      --accent: #ff5a36; --accent-2: #ffb347; --ok: #1f9d55; --shadow: 0 10px 30px rgba(20, 24, 33, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121419; --surface: #1b1e25; --surface-2: #232730; --text: #eceef2; --muted: #9aa2af; --border: #2e333d; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    a { color: var(--accent); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    header.top { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); }
    header.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; color: var(--text); text-decoration: none; }
    .brand img { width: 32px; height: 32px; }
    nav.links { margin-left: auto; display: flex; gap: 18px; align-items: center; }
    nav.links a { color: var(--muted); text-decoration: none; font-size: 15px; }
    nav.links a:hover { color: var(--text); }
    select.lang { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 14px; }
    .hero { padding: 64px 0 32px; text-align: center; }
    .hero h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.08; margin: 0 0 16px; letter-spacing: -1px; }
    .hero h1 .glow { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p.lead { font-size: clamp(18px, 2.4vw, 22px); color: var(--muted); max-width: 720px; margin: 0 auto 28px; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 30px; }
    .pill { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 14px; padding: 16px 26px; font-weight: 700; font-size: 18px; text-decoration: none; border: 0; cursor: pointer; transition: transform .1s, box-shadow .1s; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: linear-gradient(135deg, var(--accent), #ff7a3d); color: #fff; box-shadow: 0 10px 24px rgba(255, 90, 54, .35); }
    .btn.primary:hover { box-shadow: 0 14px 30px rgba(255, 90, 54, .45); }
    .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn small { display: block; font-weight: 500; font-size: 13px; opacity: .85; }
    .dl-main { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .dl-sub { color: var(--muted); font-size: 14px; }
    .dl-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .shot { margin: 40px auto 0; max-width: 980px; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .shot img { display: block; width: 100%; height: auto; }
    section { padding: 56px 0; }
    section h2 { font-size: clamp(26px, 4vw, 36px); margin: 0 0 10px; text-align: center; }
    section p.sub { text-align: center; color: var(--muted); margin: 0 auto 32px; max-width: 680px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
    .card .ico { font-size: 28px; }
    .card h3 { margin: 8px 0 6px; font-size: 19px; }
    .card p { margin: 0; color: var(--muted); font-size: 15.5px; }
    .tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
    .tabs button { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 9px 16px; font: inherit; font-size: 15px; cursor: pointer; }
    .tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
    .steps { counter-reset: s; list-style: none; padding: 0; margin: 0 auto; max-width: 760px; display: grid; gap: 12px; }
    .steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px 16px 64px; position: relative; }
    .steps li::before { content: counter(s); position: absolute; left: 16px; top: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; display: grid; place-items: center; }
    .steps li b { display: block; margin-bottom: 2px; }
    .steps li span { color: var(--muted); font-size: 15.5px; }
    .note { max-width: 760px; margin: 14px auto 0; padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--accent-2) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent-2) 45%, var(--border)); font-size: 15px; }
    .warn { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    kbd { background: var(--surface-2); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; font-size: 14px; font-family: inherit; }
    .brands { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    details.faq { max-width: 760px; margin: 0 auto 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px 18px; }
    details.faq summary { cursor: pointer; font-weight: 600; padding: 12px 0; list-style: none; }
    details.faq summary::after { content: "+"; float: right; color: var(--muted); }
    details.faq[open] summary::after { content: "−"; }
    details.faq p { margin: 0 0 14px; color: var(--muted); }
    .share { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); }
    .share .btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .share .btns a, .share .btns button { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); text-decoration: none; font: inherit; font-size: 15px; cursor: pointer; }
    .share .url { display: flex; gap: 8px; margin-top: 12px; }
    .share .url input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; font-size: 15px; }
    #qr { background: #fff; padding: 10px; border-radius: 12px; width: 156px; height: 156px; }
    #qr svg, #qr img { width: 136px; height: 136px; display: block; }
    footer { padding: 36px 0 48px; color: var(--muted); font-size: 14px; text-align: center; border-top: 1px solid var(--border); }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.on { opacity: 1; }
    .hide { display: none !important; }
    @media (max-width: 720px) {
      nav.links a { display: none; }
      .share { grid-template-columns: 1fr; text-align: center; }
      .share .btns, .share .url { justify-content: center; }
      #qr { margin: 0 auto; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#"><img src="assets/icon.svg" alt=""> Lumière</a>
      <nav class="links">
        <a href="#install" data-i18n="navInstall"></a>
        <a href="#laser" data-i18n="navLaser"></a>
        <a href="#faq" data-i18n="navFaq"></a>
        <a href="https://github.com/timal-o/lumiere">GitHub</a>
        <select class="lang" id="lang" aria-label="Langue / Language">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="zh">简体中文</option>
        </select>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap hero">
      <h1><span data-i18n="heroA"></span><br><span class="glow" data-i18n="heroB"></span></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="pills">
        <span class="pill" data-i18n="pillFree"></span>
        <span class="pill" data-i18n="pillNoAccount"></span>
        <span class="pill" data-i18n="pillLang"></span>
        <span class="pill" data-i18n="pillOs"></span>
      </div>

      <div class="dl-main" id="download">
        <a class="btn primary" id="dlPrimary" href="https://github.com/timal-o/lumiere/releases/latest">
          <span>⬇</span><span><span id="dlLabel" data-i18n="dlGeneric"></span><small id="dlDetail"></small></span>
        </a>
        <div class="dl-row hide" id="macChoice">
          <a class="btn ghost" id="dlMacArm" href="#"><span><span data-i18n="macArm"></span><small data-i18n="macArmHint"></small></span></a>
          <a class="btn ghost" id="dlMacIntel" href="#"><span><span data-i18n="macIntel"></span><small data-i18n="macIntelHint"></small></span></a>
        </div>
        <div class="dl-sub"><span id="version"></span><a href="#all" data-i18n="otherOs"></a></div>
        <div class="note hide" id="mobileNote" data-i18n="mobile"></div>
      </div>

      <div class="shot"><img id="shot" src="assets/screenshot-dark.png" alt="Lumière" loading="lazy"></div>
    </div>

    <section class="wrap">
      <h2 data-i18n="whatTitle"></h2>
      <p class="sub" data-i18n="whatSub"></p>
      <div class="grid">
        <div class="card"><div class="ico">✏️</div><h3 data-i18n="f1t"></h3><p data-i18n="f1"></p></div>
        <div class="card"><div class="ico">🖼️</div><h3 data-i18n="f2t"></h3><p data-i18n="f2"></p></div>
        <div class="card"><div class="ico">🎯</div><h3 data-i18n="f3t"></h3><p data-i18n="f3"></p></div>
        <div class="card"><div class="ico">🔤</div><h3 data-i18n="f4t"></h3><p data-i18n="f4"></p></div>
        <div class="card"><div class="ico">📂</div><h3 data-i18n="f5t"></h3><p data-i18n="f5"></p></div>
        <div class="card"><div class="ico">📷</div><h3 data-i18n="f6t"></h3><p data-i18n="f6"></p></div>
      </div>
    </section>

    <section class="wrap" id="install">
      <h2 data-i18n="installTitle"></h2>
      <p class="sub" data-i18n="installSub"></p>
      <div class="tabs" role="tablist">
        <button data-os="win">🪟 Windows</button>
        <button data-os="mac">🍎 Mac</button>
        <button data-os="linux">🐧 Linux</button>
      </div>
      <ol class="steps" data-panel="win">
        <li><b data-i18n="w1t"></b><span data-i18n="w1"></span></li>
        <li><b data-i18n="w2t"></b><span data-i18n="w2"></span></li>
        <li><b data-i18n="w3t"></b><span data-i18n="w3"></span></li>
      </ol>
      <ol class="steps hide" data-panel="mac">
        <li><b data-i18n="m1t"></b><span data-i18n="m1"></span></li>
        <li><b data-i18n="m2t"></b><span data-i18n="m2"></span></li>
        <li><b data-i18n="m3t"></b><span data-i18n="m3"></span></li>
      </ol>
      <ol class="steps hide" data-panel="linux">
        <li><b data-i18n="l1t"></b><span data-i18n="l1"></span></li>
        <li><b data-i18n="l2t"></b><span data-i18n="l2"></span></li>
        <li><b data-i18n="l3t"></b><span data-i18n="l3"></span></li>
      </ol>
      <div class="note" data-i18n="whyWarning"></div>
    </section>

    <section class="wrap" id="laser">
      <h2 data-i18n="laserTitle"></h2>
      <p class="sub" data-i18n="laserSub"></p>
      <ol class="steps">
        <li><b data-i18n="c1t"></b><span data-i18n="c1"></span></li>
        <li><b data-i18n="c2t"></b><span data-i18n="c2"></span></li>
        <li><b data-i18n="c3t"></b><span data-i18n="c3"></span></li>
        <li><b data-i18n="c4t"></b><span data-i18n="c4"></span></li>
      </ol>
      <p class="sub" style="margin-top:28px" data-i18n="brandsTitle"></p>
      <div class="brands">
        <span class="pill">Ortur</span><span class="pill">Atomstack</span><span class="pill">Sculpfun</span><span class="pill">Two Trees</span>
        <span class="pill">Creality Falcon</span><span class="pill">Comgrow</span><span class="pill">NEJE</span><span class="pill" data-i18n="brandsMore"></span>
      </div>
      <div class="note warn" data-i18n="safety"></div>
    </section>

    <section class="wrap" id="faq">
      <h2 data-i18n="faqTitle"></h2>
      <details class="faq"><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
      <details class="faq"><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
      <details class="faq"><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
      <details class="faq"><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
      <details class="faq"><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
      <details class="faq"><summary data-i18n="q6"></summary><p data-i18n="a6"></p></details>
    </section>

    <section class="wrap" id="all">
      <h2 data-i18n="allTitle"></h2>
      <p class="sub" data-i18n="allSub"></p>
      <div class="grid" id="allFiles"></div>
    </section>

    <section class="wrap" id="share">
      <h2 data-i18n="shareTitle"></h2>
      <p class="sub" data-i18n="shareSub"></p>
      <div class="share">
        <div>
          <div class="btns">
            <button id="nativeShare" class="hide">📤 <span data-i18n="shareBtn"></span></button>
            <a id="shWhatsapp" target="_blank" rel="noopener">💬 WhatsApp</a>
            <a id="shFacebook" target="_blank" rel="noopener">📘 Facebook</a>
            <a id="shX" target="_blank" rel="noopener">𝕏 X</a>
            <a id="shReddit" target="_blank" rel="noopener">👽 Reddit</a>
            <a id="shMail">✉️ E-mail</a>
          </div>
          <div class="url">
            <input id="siteUrl" readonly>
            <button class="btn ghost" style="padding:10px 14px;font-size:15px" id="copy" data-i18n="copy"></button>
          </div>
        </div>
        <div id="qr" title="QR code"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p><span data-i18n="footer"></span> · <a href="https://github.com/timal-o/lumiere">GitHub</a> · <a href="https://github.com/timal-o/lumiere/blob/main/docs/user-guide.md" data-i18n="guide"></a> · <a href="https://github.com/timal-o/lumiere/issues" data-i18n="help"></a></p>
      <p data-i18n="disclaimer"></p>
    </div>
  </footer>
  <div class="toast" id="toast"></div>

  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
