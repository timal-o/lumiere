[package]
name = "lumiere"
version = "0.6.2"
description = "Open-source laser engraving and cutting software"
license = "GPL-3.0-or-later"
repository = "https://github.com/timal-o/lumiere"
authors = ["timal-o"]
edition = "2021"

[lib]
name = "lumiere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tauri-plugin-opener = "2"
