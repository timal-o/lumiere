name: Feature request
description: Suggest an improvement or a missing feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could Lumière help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
      description: Other software, workarounds…
